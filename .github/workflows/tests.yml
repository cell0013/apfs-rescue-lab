name: Python checks
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python-version: '3.9'
          - os: ubuntu-24.04
            python-version: '3.12'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile all Python source
        run: python3 -m compileall -q apfs_rescue.py tools experimental tests
      - name: Run synthetic unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Check command interfaces
        run: |
          python3 apfs_rescue.py --help
          python3 experimental/checkpoint_select.py --help
          python3 tools/apfs_analyzer.py --help
          python3 tools/block_diff.py --help

  macos-clone:
    runs-on: macos-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test real clonefile and unified recover command on synthetic RAW
        run: python3 -m unittest discover -s tests -p 'test_clone_mac.py' -v
