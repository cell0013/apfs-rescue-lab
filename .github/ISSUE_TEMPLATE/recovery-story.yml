name: Recovery story / История восстановления
description: Share an anonymized APFS recovery experience, including unsuccessful attempts
title: "[Recovery story] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping make APFS Rescue Lab more useful. Please share **only anonymous/sanitized details**. Public issue: no images of real disks, personal files, logs with usernames, paths, volume UUIDs, serials, passwords or secrets. / Спасибо! Не публикуйте личные данные.
  - type: dropdown
    id: result
    attributes:
      label: Outcome / Результат
      options:
        - Files recovered / Файлы восстановлены
        - Boot recovered / Система загрузилась
        - Partial recovery / Частичное восстановление
        - No recovery / Восстановление не удалось
        - Still investigating / Продолжаю поиск
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and version / ОС и версия
      placeholder: e.g. macOS Catalina 10.15.7
    validations:
      required: true
  - type: input
    id: setup
    attributes:
      label: APFS disk type / Тип APFS-диска
      placeholder: e.g. non-encrypted GPT RAW image from a virtual machine
  - type: textarea
    id: symptoms
    attributes:
      label: Initial symptoms / Исходная проблема
      description: No identifying information; describe only general symptoms.
    validations:
      required: true
  - type: textarea
    id: method
    attributes:
      label: What did you try? / Какие действия предпринимали?
      description: Steps, tools, observed messages with private fields removed.
    validations:
      required: true
  - type: textarea
    id: result-details
    attributes:
      label: Outcome and lessons / Итог и выводы
      description: Which files, boot stages or checks could you verify?
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy / Конфиденциальность
      options:
        - label: I checked this report and removed private data, credentials, disk images and identifying logs.
          required: true
